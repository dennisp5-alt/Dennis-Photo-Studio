              assert needle in a, needle
          for gone in ('structure_fraction<0.09','9.0+12.0*soft_fraction',
                       '9.0+14.0*lift_strength'):
              assert gone not in a, gone
          assert 'warm_emitters as f64 / n > 0.002' in a
          assert 'shadow_fraction>0.64 && median< -2.1 && bright_fraction<0.35' in a
          assert '0.26*(-0.60-median)' in a
          assert '0.30*(median-0.85)' in a
          assert 'mod studio_v065_evidence_gate_regressions' in a
          assert 'smart_auto_tone_report_all_guards_off(&src,&info,&' not in e
          assert 'auto_wb_report_all_guards_off(&src,&info)' not in e
          assert 'auto_wb_report_all_guards_off(&src, &info)' not in e
          assert 'let manual_wb=current.wb.mode==WbMode::Custom' in e
          assert 'let manual_wb=d.wb.mode==WbMode::Custom' in e
          assert 'smart_auto_tone_report_balanced(&src,&info,&' in e
          assert 'auto_wb_report_balanced(&src, &info)' in e
          assert 'photographic_wb_preservation_gates_bypassed_test_only' in a
          assert 'all_photographic_auto_guards_disabled_test_only' in a
          assert 'cmd!("develop.autoPreview"' in e
          assert '"sourceSettings":current' in e
          assert '"previewSettings":proposal' in e
          assert 'Restored Auto uses original editable engine controls' in e
          assert '"model":model' in e
          assert 'optionc_pilot_v1.json' in Path('crates/pipeline/src/optionc.rs').read_text()
          assert 'pub mod optionc;' in Path('crates/pipeline/src/lib.rs').read_text()
          assert 'fn native_proxy_model_is_deterministic_and_non_destructive' in Path('crates/pipeline/src/optionc.rs').read_text()
          for check in (
              'fn firelight_preserves_ambient_warmth_in_auto_wb',
              'fn orange_lamplight_in_dark_room_remains_warm',
              'fn ordinary_neutral_cast_is_still_correctable',
              'fn blue_sky_dark_detailled_foreground_receives_local_recovery',
              'fn intentional_warm_sunset_still_has_no_forced_curve_lift',
          ):
              assert check in a, check
          for check in (
              'fn balanced_textured_photo_gets_some_gentle_refinement',
              'fn mildly_dim_normal_photo_does_not_require_major_defect',
              'fn neutral_flat_subject_keeps_colour_neutral',
