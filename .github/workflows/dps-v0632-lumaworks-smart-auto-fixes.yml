name: LumaWorks v0.6.32 — Smart Auto fixes

on:
  push:
    branches: [experiment/lumaworks-v0.6.32-smart-auto-fixes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumaworks-v0632
  cancel-in-progress: true

jobs:
  smart-auto-tests-and-ab:
    name: Smart Auto tests and old-vs-new photo comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Audit production wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('crates/pipeline/src/auto.rs').read_text()
          e=Path('crates/engine/src/cmd/develop.rs').read_text()
          vm=Path('apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/ui/AppViewModel.kt').read_text()
          assert 'pub fn smart_auto_tone_report_balanced_with_wb(' in a
          assert 'pub fn smart_auto_tone_report_balanced_v0630(' in a
          assert 'fn production_quality_guard(' in a
          # Both production commands analyse and guard under the WB they apply.
          assert e.count('smart_auto_tone_report_balanced_with_wb(')==2
          assert e.count('let manual_wb=!matches!(')==2
          assert e.count('"preservedWbMode"')==2
          # The legacy all-or-nothing guard is untouched for its own tests.
          assert 'if new_whites>0.028' in a and 'if new_blacks>0.028' in a
          assert 'private var smartAutoBusy = false' in vm
          assert 'fun smartAutoWbStatus(' in vm and 'fun smartAutoSummary(' in vm
          g=Path('apps/lightcraft-android/android/gradle.properties').read_text()
          assert 'lightcraft.version=0.6.32-beta.6' in g and 'lightcraft.versionCode=63206' in g
          assert 'com.dennis.lumaworks.autofix.v0632' in Path(
              'apps/lightcraft-android/android/app/build.gradle.kts').read_text()
          m=Path('crates/engine/src/cmd/masks.rs').read_text()
          assert '"mask.auto"' in m and 'mask_auto::mask_auto(' in m
          assert 'AUTO("Auto", LcIcon.SectionAuto, emptyList())' in Path(
              'apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/ui/MaskTool.kt').read_text()
          assert 'fun applyMaskAuto()' in vm
          sm=Path('apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/engine/SemanticMasker.kt').read_text()
          assert 'SalientObject.saliency(' in sm and 'saliencyUsable(' in sm
          print('Smart Auto v0.6.32 wiring: PASS')
          PY
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Build the comparison tools
        run: cargo +1.99.0 build -p lightcraft-pipeline --example auto_compare --example mask_auto_compare --locked
      - name: Fetch public test photographs and make exposure/colour variants
        continue-on-error: true
        run: |
          set -u
          mkdir -p eval/kodak eval/in
          for n in 01 02 03 04 05 07 08 13 14 15 16 19 20 21 22 23 24; do
            curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 20 \
              -o "eval/kodak/kodim$n.png" "https://r0k.us/graphics/kodak/kodak/kodim$n.png" \
              || echo "could not fetch kodim$n"
          done
          ls eval/kodak | wc -l
          python3 -m pip install --quiet pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          src=Path('eval/kodak'); out=Path('eval/in')
          def lin(a):
              a=a/255.0
              return np.where(a<=0.04045,a/12.92,((a+0.055)/1.055)**2.4)
          def enc(l):
              l=np.clip(l,0,1)
              s=np.where(l<=0.0031308,l*12.92,1.055*l**(1/2.4)-0.055)
              return Image.fromarray((s*255+0.5).astype(np.uint8))
          plan={
            'a_orig':(['01','02','03','04','05','07','08','13','14','15','16','19','20','21','22','23','24'],None),
            'b_under13':(['01','05','08','13','16','19','21','22','24'],lambda l:l*2**-1.3),
            'c_under20':(['03','14'],lambda l:l*2**-2.0),
            'd_warmcast':(['04','15','20','23'],lambda l:l*np.array([1.18,1.0,0.78])),
            'e_over08':(['02','07'],lambda l:l*2**0.8),
          }
          for prefix,(ids,f) in plan.items():
              for i in ids:
                  p=src/f'kodim{i}.png'
                  if not p.exists(): continue
                  img=Image.open(p).convert('RGB')
                  if f is None:
                      img.save(out/f'{prefix}_kodim{i}.png')
                  else:
                      enc(f(lin(np.asarray(img,dtype=np.float64)))).save(out/f'{prefix}_kodim{i}.png')
          # A flat, low-contrast copy (haze/fog-like) of two landscapes.
          for i in ('13','21'):
              p=src/f'kodim{i}.png'
              if p.exists():
                  a=np.asarray(Image.open(p).convert('RGB'),dtype=np.float64)
                  Image.fromarray((0.55*a+0.45*150).astype(np.uint8)).save(out/f'f_flat_kodim{i}.png')
          print(len(list(out.iterdir())),'test images')
          PY
      - name: Render old (v0.6.30) vs new (v0.6.32) Smart Auto
        continue-on-error: true
        run: |
          mkdir -p eval/in eval/out
          cargo +1.99.0 run -p lightcraft-pipeline --example auto_compare --locked -- eval/in eval/out | tee eval/out/summary.txt
      - name: Person-matte check on test portraits (MODNet)
        continue-on-error: true
        run: |
          set -eu
          mkdir -p eval/models eval/out/masks
          curl -fsSL --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://huggingface.co/Xenova/modnet/resolve/main/onnx/model.onnx?download=true" -o eval/models/modnet.onnx
          sha256sum eval/models/modnet.onnx | tee eval/out/masks/modnet_sha256.txt
          python3 -m pip install --quiet onnxruntime==1.22.0 numpy pillow
          python3 - <<'PY2'
          from pathlib import Path
          import numpy as np, onnxruntime as ort
          from PIL import Image
          s=ort.InferenceSession('eval/models/modnet.onnx',providers=['CPUExecutionProvider'])
          i=s.get_inputs()[0]; o=s.get_outputs()[0]
          info=f"input {i.name} {i.shape} / output {o.name} {o.shape}"
          print(info); Path('eval/out/masks/modnet_io.txt').write_text(info+"\n")
          for name in ['kodim04','kodim15','kodim05','kodim14','kodim24']:
              p=Path(f'eval/kodak/{name}.png')
              if not p.exists(): continue
              im=Image.open(p).convert('RGB'); W,H=im.size
              k=512/min(W,H); w=max(32,round(W*k)//32*32); h=max(32,round(H*k)//32*32)
              a=np.asarray(im.resize((w,h),Image.BILINEAR),dtype=np.float32)/127.5-1
              x=a.transpose(2,0,1)[None]
              m=s.run(None,{i.name:x})[0][0,0]
              m=np.asarray(Image.fromarray((np.clip(m,0,1)*255).astype(np.uint8)).resize((W,H),Image.BILINEAR),dtype=np.float32)/255
              base=np.asarray(im,dtype=np.float32)
              red=base*(1-0.55*m[...,None])+np.array([255,0,0],np.float32)*0.55*m[...,None]
              row=np.concatenate([base,red,np.repeat(m[...,None]*255,3,-1)],1)
              Image.fromarray(row.clip(0,255).astype(np.uint8)).save(f'eval/out/masks/{name}_matte.jpg',quality=88)
              print(name,'matte mean',float(m.mean()))
          PY2
      - name: Subject saliency (U2-Netp) and per-mask Auto on test photos
        continue-on-error: true
        run: |
          set -eu
          mkdir -p eval/models eval/masks_in eval/out/saliency eval/out/mask_auto
          curl -fsSL --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -o eval/models/u2netp.onnx
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  eval/models/u2netp.onnx" | sha256sum --check
          python3 -m pip install --quiet onnxruntime==1.22.0 numpy pillow
          python3 - <<'PY3'
          from pathlib import Path
          import json, numpy as np, onnxruntime as ort
          from PIL import Image
          s=ort.InferenceSession('eval/models/u2netp.onnx',providers=['CPUExecutionProvider'])
          names=['a_orig_kodim%s'%i for i in ['01','02','03','04','05','07','08','13','14','15','16','19','20','21','22','23','24']]+['b_under13_kodim05','b_under13_kodim16','e_over08_kodim07']
          for n in names:
              p=Path(f'eval/in/{n}.png')
              if not p.exists(): continue
              im=Image.open(p).convert('RGB'); W,H=im.size
              x=np.asarray(im.resize((320,320),Image.BILINEAR),np.float32)/255.
              x=(x-[0.485,0.456,0.406])/[0.229,0.224,0.225]
              raw=s.run(None,{s.get_inputs()[0].name:x.transpose(2,0,1)[None].astype(np.float32)})[0][0,0]
              if raw.max()<0.5: print(n,'nothing salient'); continue
              m=(raw-raw.min())/(raw.max()-raw.min())
              q=np.clip(m,1e-6,1-1e-6); logit=np.clip(np.log(q/(1-q)),-12,12)
              im.save(f'eval/masks_in/{n}.png')
              Path(f'eval/masks_in/{n}.seg.json').write_text(json.dumps({'side':320,'logits':[round(float(v),3) for v in logit.ravel()]}))
              a=np.asarray(Image.fromarray((m*255).astype(np.uint8)).resize((W,H),Image.BILINEAR),np.float32)/255.
              base=np.asarray(im,np.float32); g=base.mean(2,keepdims=True)*.25+np.array([0,0,60.])
              Image.fromarray(np.clip(base*a[...,None]+g*(1-a[...,None]),0,255).astype(np.uint8)).save(f'eval/out/saliency/{n}.jpg',quality=85)
              print(n,'salient area %.3f'%float((m>.5).mean()))
          PY3
          cargo +1.99.0 run -p lightcraft-pipeline --example mask_auto_compare --locked -- eval/masks_in eval/out/mask_auto | tee eval/out/mask_auto/summary.txt
      - name: Publish the comparison to the eval branch
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          cd eval/out
          printf 'Smart Auto A/B for %s\n\nEach image: original | v0.6.30 Smart Auto | v0.6.32 Smart Auto (same Auto WB on both).\n' "$GITHUB_SHA" > README.md
          git init -q -b eval
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Smart Auto A/B ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" eval:eval/lumaworks-v0632-auto-compare
      - name: Smart Auto, colour and tone regression tests
        run: cargo +1.99.0 test -p lightcraft-pipeline --locked --lib
      - name: Engine type-check (mask.auto command)
        run: cargo +1.99.0 check -p lightcraft-engine --locked
      - name: Engine Smart Auto command tests (preview equals one-tap, WB kept)
        if: github.event_name == 'workflow_dispatch'
        run: cargo +1.99.0 test -p lightcraft-engine --locked --lib smart_auto

  apk:
    name: ARM64 test APK
    # Saves Actions minutes: the APK is built only on request (Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK manager
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
      - name: Android SDK 37.0 and NDK 29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "ndk;29.0.14206865"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          rustup default 1.99.0
          cargo +1.99.0 install cargo-ndk --version 4.1.2 --locked
      - name: Cache native Rust build and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Type-check native engine and Android HEIC feature
        run: |
          cargo +1.99.0 check -p lightcraft-engine --features lightcraft-codecs/heif --locked
          cargo +1.99.0 check -p lightcraft-android --features heic --locked
      - name: Bundle checksum-verified offline ADE20K weights
        run: |
          set -euo pipefail
          ASSETS=apps/lightcraft-android/android/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://huggingface.co/Xenova/segformer-b0-finetuned-ade-512-512/resolve/main/onnx/model.onnx?download=true" \
            --output "$ASSETS/segformer_b0_ade.onnx"
          echo "3e5c18a4be395f16646438d54c42377ddc202edfa33d5eced0c9506de75c44c2  $ASSETS/segformer_b0_ade.onnx" | sha256sum --check
          test "$(stat -c%s "$ASSETS/segformer_b0_ade.onnx")" -gt 10000000
      - name: Bundle offline person-matting weights (MODNet, Apache-2.0)
        run: |
          set -euo pipefail
          ASSETS=apps/lightcraft-android/android/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://huggingface.co/Xenova/modnet/resolve/main/onnx/model.onnx?download=true" \
            --output "$ASSETS/modnet_portrait.onnx"
          sha256sum "$ASSETS/modnet_portrait.onnx"
          test "$(stat -c%s "$ASSETS/modnet_portrait.onnx")" -gt 20000000
      - name: Bundle offline salient-object weights (U2-Netp, Apache-2.0)
        run: |
          set -euo pipefail
          ASSETS=apps/lightcraft-android/android/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" \
            --output "$ASSETS/u2netp_salient.onnx"
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  $ASSETS/u2netp_salient.onnx" | sha256sum --check
      - name: Kotlin unit tests
        working-directory: apps/lightcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest -Plightcraft.abis=arm64-v8a
      - name: Assemble ARM64 APK
        working-directory: apps/lightcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -Plightcraft.abis=arm64-v8a
      - name: Verify APK
        run: |
          APK=apps/lightcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaWorks-v0.6.32-Smart-Auto-Fixes-ARM64
          path: apps/lightcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
