plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dennis.craftmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dennis.craftmobile'
        minSdk 29
        targetSdk 35
        versionCode 15
        versionName '0.7.0-restore-experiment'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
}
