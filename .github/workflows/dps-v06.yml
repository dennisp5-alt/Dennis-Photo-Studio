name: Dennis Photo Studio v0.6 — Adaptive Smart Auto + WB

on:
  push:
    branches: [studio-v0.6-adaptive-auto-wb]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dps-adaptive-v06
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Audit expected Smart Auto and WB source
        run: |
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          test -f apps/lightcraft-android/android/app/src/main/res/drawable/dennis_studio_lens.xml
          python3 - <<'PY'
          from pathlib import Path
          a=Path('crates/pipeline/src/auto.rs').read_text()
          e=Path('crates/engine/src/cmd/develop.rs').read_text()
          vm=Path('apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/ui/AppViewModel.kt').read_text()
          p=Path('apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/ui/EditorScreen.kt').read_text()
          edit=Path('apps/lightcraft-android/android/app/src/main/java/ai/storyteller/lightcraft/ui/EditPanels.kt').read_text()
          for needle in ('pub fn smart_auto_tone', 'pub fn auto_wb_report', 'pub fn auto_detail',
                         'struct studio_v06_adaptive_tests', 'fn luminescent_subject_keeps_emission',
                         'fn jpeg_white_highlights_do_not_veto_all_positive_exposure',
                         'fn tinted_neutral_clusters_receive_a_reported_correction',
                         'fn highly_saturated_flower_does_not_get_forced_white_balance',
                         'pub decision:&' ):
              assert needle in a, needle
          for needle in ('cmd!("develop.auto", "Smart Auto"', 'SourceLevel::Preview)',
                         'd.curve.shadows=a.curve_shadows','d.curve.darks=a.curve_darks',
                         'lightcraft_pipeline::auto::auto_wb_report(&src,&info)',
                         'manual_wb', '"autoReport": auto_report',
                         'SourceLevel::Full} else {SourceLevel::Preview}'):
              assert needle in e, needle
          assert 'luminance noise not detected' in a
          assert 'colour noise not detected' in a
          assert 'QuickAction.AUTO -> applySmartAuto()' in vm
          assert 'EditSection.AUTO -> applySmartAuto()' in vm
          assert 'Auto WB corrected using neutral-region agreement' in vm
          assert 'runAutoDetail()' in vm and 'AutoAmountDialog' not in p
          assert 'Classic Auto' not in p and 'AutoAmountDialog' not in vm
          assert 'vm.runAutoDetail()' in edit and 'Current: Luminance NR ' in edit
          assert 'ed.wbAutoStatus' in edit and 'Advanced' in edit
          assert 'lightcraft.version=0.6.0-beta' in Path('apps/lightcraft-android/android/gradle.properties').read_text()
          assert 'com.dennis.photostudio.adaptive.v06' in Path('apps/lightcraft-android/android/app/build.gradle.kts').read_text()
          print('Source preservation and feature integrity: PASS')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK manager
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
      - name: Android SDK 37.0 and NDK 29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "ndk;29.0.14206865"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          rustup default 1.99.0
          cargo +1.99.0 install cargo-ndk --version 4.1.2 --locked
      - name: Cache native Rust build and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Validate photographic pipeline and WB / Auto tests
        run: |
          cargo +1.99.0 test -p lightcraft-pipeline --locked --lib
          cargo +1.99.0 test -p lightcraft-develop --locked --lib
      - name: Assemble ARM64 APK
        working-directory: apps/lightcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -Plightcraft.abis=arm64-v8a
      - name: Verify APK and app identity
        run: |
          APK=apps/lightcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Dennis-Photo-Studio-v0.6-Adaptive-Auto-WB-ARM64
          path: apps/lightcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish pre-release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dennis-photo-studio-v0.6-adaptive-auto-wb
          name: Dennis Photo Studio v0.6 — Adaptive Auto & WB (Experimental)
          prerelease: true
          body: |
            Experimental, offline Dennis Photo Studio v0.6 for Android ARM64.
            Independent side-by-side install (com.dennis.photostudio.adaptive.v06).

            Smart Auto's global percentile exposure veto is replaced with
            image-structure-aware analysis. Bright white clouds no longer
            automatically disable positive exposure correction; white highlights
            receive restrained rolloff, and recoverable foreground shadows and
            midtones get appropriate parametric-curve lift. Emissive fire on a
            genuinely dark background keeps its bright flames and deep blacks.

            White Balance uses independent spatial neutral patches and
            confidence/consistency rather than one fixed pixel fraction
            cutoff. It distinguishes "corrected", "already neutral",
            "ambiguous" and "no reliable neutral". One-tap Smart Auto can
            apply WB when supported, without overriding manually chosen Custom.

            The Auto Detail native-resolution luminance/chroma denoising and
            sharpening code is unchanged from v0.3.1. Manual controls,
            profiles, undo, export and independent Auto Detail remain available.

            Benchmarked using private user Kodak PIXPRO FZ55 JPEGs. No private
            user photographs were uploaded to or committed into this repository.
            Synthesized regression scenes exercise clipping, highlight safety,
            neutral WB agreement and saturated-colour protection. No Adobe
            proprietary assets or models have been copied. The historical
            learned 3D LUT weights from the older Polished AI app are absent
            from its GitHub branch and are NOT included in this APK.

            Test actual camera JPEG exports against their originals and
            Lightroom before promoting to production.
          files: apps/lightcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
