      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK manager
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
      - name: Android SDK 37.0 and NDK 29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "ndk;29.0.14206865"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          rustup default 1.99.0
          cargo +1.99.0 install cargo-ndk --version 4.1.2 --locked
      - name: Cache native Rust build and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Validate finished-photo, corrective-photo, colour and NR regressions
        run: |
          cargo +1.99.0 test -p lightcraft-pipeline --locked --lib
          cargo +1.99.0 test -p lightcraft-develop --locked --lib
          cargo +1.99.0 test -p lightcraft-codecs --features heif --locked --lib
      - name: Build offline evaluator for real local photographs
        run: |
          cargo +1.99.0 build -p lightcraft-pipeline --example photo_eval --locked
      - name: Upload local photographic QA evaluator
        uses: actions/upload-artifact@v4
        with:
          name: LumaWorks-v0.6.30-Local-Photo-Evaluator
          path: target/debug/examples/photo_eval
          if-no-files-found: error
          retention-days: 7
      - name: Type-check complete native engine and Android HEIC feature before packaging
        run: |
          cargo +1.99.0 check -p lightcraft-engine --features lightcraft-codecs/heif --locked
          cargo +1.99.0 check -p lightcraft-android --features heic --locked
      - name: Bundle checksum-verified offline ADE20K weights
        run: |
          set -euo pipefail
          ASSETS=apps/lightcraft-android/android/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 5 --retry-delay 4 --connect-timeout 30 \
            "https://huggingface.co/Xenova/segformer-b0-finetuned-ade-512-512/resolve/main/onnx/model.onnx?download=true" \
            --output "$ASSETS/segformer_b0_ade.onnx"
          echo "3e5c18a4be395f16646438d54c42377ddc202edfa33d5eced0c9506de75c44c2  $ASSETS/segformer_b0_ade.onnx" | sha256sum --check
          test "$(stat -c%s "$ASSETS/segformer_b0_ade.onnx")" -gt 10000000
      - name: Smoke-test semantic model input/output on CPU
        run: |
          python3 -m pip install --quiet onnxruntime==1.22.0 numpy
          python3 - <<'PY'
          import numpy as np, onnxruntime as ort
          model='apps/lightcraft-android/android/app/src/main/assets/segformer_b0_ade.onnx'
