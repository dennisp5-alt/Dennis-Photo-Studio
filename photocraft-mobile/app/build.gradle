plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dennis.craftmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dennis.craftmobile'
        minSdk 29
        targetSdk 35
        versionCode 16
        versionName '0.6.10-straighten-fix'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
