name: Dennis Craft Mobile APK
on:
  push:
    branches:
      - experiment/dennis-craft-mobile-v0.1
      - experiment/dennis-craft-mobile-v0.2
      - experiment/dennis-craft-mobile-v0.3
      - experiment/dennis-craft-mobile-v0.4
      - experiment/dennis-craft-mobile-v0.5
      - experiment/dennis-craft-mobile-v0.6
      - experiment/dennis-craft-mobile-v0.6.1-performance
      - experiment/dennis-craft-mobile-v0.6.2-performance-swipe
      - experiment/dennis-craft-mobile-v0.6.3-scene-auto
      - experiment/dennis-craft-mobile-v0.6.4-atmosphere-auto
      - experiment/dennis-craft-mobile-v0.6.5-four-level-auto
      - experiment/dennis-craft-mobile-v0.6.8-scene-intelligence
      - experiment/dennis-craft-mobile-v0.6.9-auto-straighten
      - experiment/dennis-craft-mobile-v0.6.10-straighten-fix
      - experiment/dennis-craft-mobile-v0.6.11-line-aware-straighten
      - experiment/dennis-craft-mobile-v0.6.12-straighten-safety
      - experiment/dennis-craft-mobile-v0.6.13-guided-straighten
      - experiment/dennis-craft-mobile-v0.6.14-crop-transform
      - experiment/dennis-craft-mobile-v0.6.15-structure-detection
      - experiment/dennis-craft-mobile-v0.6.16-album-browser
    paths:
      - 'photocraft-mobile/**'
      - '.github/workflows/dennis-craft-mobile-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        run: gradle -p photocraft-mobile --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dennis-craft-mobile-v0.6.16-album-browser-debug-apk
          path: photocraft-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
