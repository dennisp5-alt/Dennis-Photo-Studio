          assert 'let fine_shadow=if no_guards && zonal.fine.mixed_light_shadow_detail' in a
          assert 'fn fine_grid_finds_small_dark_subject_diluted_in_a_three_by_three_tile' in scene
          assert 'fn fine_grid_never_forces_a_black_background_into_a_shadow_subject' in scene
          assert 'fn tiny_dark_subject_in_bright_surroundings_gets_editable_fine_shadow_evidence' in a
          assert 'runAutoDetail()' in vm and 'AutoAmountDialog' not in p
          assert 'Classic Auto' not in p and 'AutoAmountDialog' not in vm
          assert 'vm.runAutoDetail()' in edit and 'Current: Luminance NR ' in edit
