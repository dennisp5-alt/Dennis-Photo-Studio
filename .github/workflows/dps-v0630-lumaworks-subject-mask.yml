          assert 'brief = true' in vm
          manifest=Path('apps/lightcraft-android/Cargo.toml').read_text()
          gradle=Path('apps/lightcraft-android/android/app/build.gradle.kts').read_text()
          assert 'heic = ["lightcraft-codecs/heif"]' in manifest
          assert '"--features", "heic"' in gradle
          assert 'fn fire_on_dark_background_keeps_flame_exposure_without_disabling_shadows' in a
          assert 'FineSceneEvidence' in scene
