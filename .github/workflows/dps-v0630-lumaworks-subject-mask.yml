          assert 'fn v0616_white_petals_receive_highlight_protection_without_global_lift' in a
          assert 'fn v0616_dark_scene_with_a_warm_flame_uses_existing_firelight_policy' in a
          assert 'pub micro:MicroSceneEvidence' in scene
          assert 'micro:analyse_micro_linear(img,&lum)' in scene
          assert 'let micro_shadow=if no_guards && zonal.micro.mixed_light_shadow_detail' in a
