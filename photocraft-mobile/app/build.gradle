plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dennis.craftmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dennis.craftmobile'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.7.2-advanced-restore'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    // Bundled offline face-location model (not online / Play Services downloaded).
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
